name: Instagram自動投稿

on:
  schedule:
    # 毎日 21:00 JST（= 12:00 UTC）。GitHub側の混雑で数分〜数十分遅れることがある
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（公開しない）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 次の1本を投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v25.0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET || 'ig-images' }}
        run: node scripts/publish.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 投稿済みの記録をコミット
        run: |
          if [ -n "$(git status --porcelain posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts
            git commit -m "投稿済みを記録: $(date -u +%Y-%m-%d)"
            git push
          fi

  # 投稿した回をリンク集ページに載せる（ドライランのときはしない）
  site:
    needs: publish
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
